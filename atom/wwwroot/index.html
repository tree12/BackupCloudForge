<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script>
var dictionary = {};
dictionary["single"]=true;
dictionary["family"]=false;
$(document).ready(function(){
    $("button").click(function(){
        $.get("test.txt", function(data, status){
            alert("Data: " + data + "\nStatus: " + status);
        });
    });
	$(".switchImg").click(function(ev){
		//alert('icon clicked');
		SwitchImage(ev.target.id,true,true);
	});
	
	$(".switchImg").mouseenter(function(ev) {
		SwitchImage(ev.target.id,false,true);
	}).mouseleave(function(ev) {
		SwitchImage(ev.target.id,false,false);
	});
	/*$(".test" ).mouseover(function() {
		SwitchImage(event.target.id,false,true)
	}).mouseout(function() {
		SwitchImage(event.target.id,false,false)
	});*/
});

function SwitchImage(id,change,over) {
	if (change) dictionary[id]=!dictionary[id];
	var imgName=id;
	if (dictionary[id]) imgName+="_check";
	if (over) imgName+="_over";
    $("#"+id).attr("src","pic/"+imgName+".png");
}



</script>
</head>
<body>

<button>Send an HTTP GET request to a page and get the result back</button>

<img class="switchImg" id="single" src="pic/single.png"/>
<img class="switchImg" id="family" src="pic/family.png"/>
<img class="switchImg" id="retired" src="pic/retired.png"/>

</body>
</html>
